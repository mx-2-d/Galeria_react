<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">    
  <title>Paso 3: Pasar Props</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: {
              950: '#04141a',
              900: '#08222b',
              800: '#0d313d',
              700: '#144754',
              600: '#1d5e6e',
            },
            coral: {
              400: '#ff8a6b',
              500: '#ff6b47',
              600: '#e8512c',
            },
            sand: {
              100: '#fdf6ee',
              200: '#f5e6d3',
              300: '#e8d0b3',
            }
          },
          fontFamily: {
            display: ['"Space Grotesk"', 'system-ui', 'sans-serif'],
            body: ['"Inter"', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .font-display { font-family: 'Space Grotesk', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-ink-950 text-sand-100 min-h-screen antialiased">

  <!-- Decorative background -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden" aria-hidden="true">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-coral-500/10 rounded-full blur-3xl"></div>
    <div class="absolute top-1/3 -right-40 w-[30rem] h-[30rem] bg-ink-600/40 rounded-full blur-3xl"></div>
    <div class="absolute bottom-0 left-1/4 w-96 h-96 bg-coral-400/5 rounded-full blur-3xl"></div>
  </div>

  <main id="cuerpo" class="relative w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-10 py-10 sm:py-14 lg:py-20"></main>

  <script src="posts.js"></script>
  <script type="text/babel">

    function Caja({ post }) {
      return (
        <article className="group relative flex flex-col bg-ink-900/70 backdrop-blur-sm border border-ink-700/60 rounded-3xl overflow-hidden shadow-xl shadow-ink-950/40 hover:border-coral-500/50 hover:shadow-2xl hover:shadow-coral-500/10 hover:-translate-y-1.5 transition-all duration-300 ease-out">

          {/* Image */}
          <div className="relative aspect-[16/10] overflow-hidden bg-ink-800">
            <img
              src={post.image}
              alt={post.title}
              className="w-full h-full object-cover opacity-90 group-hover:opacity-100 group-hover:scale-105 transition-all duration-500 ease-out"
              onError={(e) => {
                e.target.src = "https://placehold.co/600x400/08222b/ff8a6b?text=Tortuga";
              }}
            />
            {/* Gradient overlay */}
            <div className="absolute inset-0 bg-gradient-to-t from-ink-950/80 via-transparent to-transparent"></div>

            {/* Date badge */}
            <span className="absolute top-3 right-3 sm:top-4 sm:right-4 bg-ink-950/70 text-sand-200 text-[10px] sm:text-xs font-semibold uppercase tracking-wider px-2.5 py-1 sm:px-3 sm:py-1.5 rounded-full border border-ink-700/50 backdrop-blur-md">
              {post.created_at}
            </span>
          </div>

          {/* Content */}
          <div className="flex flex-col flex-1 p-5 sm:p-6">
            {/* Accent line + title */}
            <div className="flex items-start gap-3 mb-3">
              <span className="mt-1.5 block w-1 h-5 sm:h-6 bg-coral-500 rounded-full shrink-0"></span>
              <h2 className="font-display text-base sm:text-lg font-bold text-sand-100 leading-snug">
                {post.title}
              </h2>
            </div>

            <p className="text-xs sm:text-sm italic text-coral-400/80 mb-3 leading-relaxed">
              {post.description}
            </p>

            <p className="text-sm text-sand-300/70 leading-relaxed mb-5 line-clamp-4 flex-1">
              {post.content}
            </p>

            <button className="group/btn mt-auto self-start inline-flex items-center gap-2 bg-transparent hover:bg-coral-500 text-coral-400 hover:text-ink-950 text-xs sm:text-sm font-semibold px-4 py-2 sm:px-5 sm:py-2.5 rounded-full border border-coral-500/40 hover:border-coral-500 transition-all duration-200">
              Leer más
              <span className="transition-transform duration-200 group-hover/btn:translate-x-1">→</span>
            </button>
          </div>
        </article>
      );
    }

    function PostsContainer({ posts }) {
      return (
        <section>
          {/* Header */}
          <header className="mb-10 sm:mb-14 lg:mb-16 text-center sm:text-left">
            <div className="inline-flex items-center gap-2 mb-4 px-3 py-1.5 rounded-full bg-ink-800/60 border border-ink-700/50">
              <span className="w-2 h-2 rounded-full bg-coral-500 animate-pulse"></span>
              <span className="text-[10px] sm:text-xs font-semibold uppercase tracking-[0.2em] text-sand-300/70">
                Blog · Tortugas
              </span>
            </div>

            <h1 className="font-display text-3xl sm:text-4xl lg:text-5xl font-bold text-sand-100 leading-tight tracking-tight">
              Historias del <span className="text-coral-500">caparazón</span>
            </h1>

            <p className="text-sand-300/60 text-sm sm:text-base mt-3 max-w-xl mx-auto sm:mx-0">
              {posts.length} artículos sobre el cuidado, la vida y las curiosidades de las tortugas.
            </p>

            {/* Divider */}
            <div className="mt-6 h-px w-full max-w-xs mx-auto sm:mx-0 bg-gradient-to-r from-coral-500/60 via-ink-700 to-transparent"></div>
          </header>

          {/* Grid */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 sm:gap-6 lg:gap-7">
            {posts.map((p) => (
              <Caja key={p.id} post={p} />
            ))}
          </div>
        </section>
      );
    }

    function App() {
      return <PostsContainer posts={postsData} />;
    }

    const container = document.getElementById('cuerpo');
    const cuerpo = ReactDOM.createRoot(container);
    cuerpo.render(<App />);

  </script>
</body>
</html>
